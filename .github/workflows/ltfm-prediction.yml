name: LTFM prediction every 3 hours

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ltfm-prediction
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out formula engine
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NOAA correction dependencies
        run: python -m pip install numpy scikit-learn

      - name: Refresh live model inputs
        run: python scripts/refresh_model_data.py

      - name: Run LTFM formula
        run: python scripts/run_ltfm.py --out ltfm-run

      - name: Apply NOAA correction and update daily history
        id: candidate95
        run: |
          slot=""
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            hour="$(TZ=Europe/Istanbul date +%H)"
            case "$hour" in
              00|03|06|09|12|15|18|21) slot="$hour" ;;
            esac
          fi
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          python ltfm_candidate95.py --run-dir ltfm-run --slot "$slot"

      - name: Save NOAA forecast history
        if: steps.candidate95.outputs.slot != ''
        run: |
          if [ -f data/candidate95_live.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/candidate95_live.json
            git diff --cached --quiet || { git commit -m "NOAA calibration forecast history" && git push; }
          fi

      - name: Keep the exact snapshot and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltfm-prediction-${{ github.run_number }}
          path: |
            data/*.json
            ltfm-run/*.json
            ltfm-run/*.md
          if-no-files-found: warn
          retention-days: 30

      - name: Send native GitHub notification
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'LTFM tahminleri — 3 saatlik otomasyon';
            const marker = '<!-- ltfm-prediction -->';
            const forecast = fs.existsSync('ltfm-run/forecast.md')
              ? fs.readFileSync('ltfm-run/forecast.md', 'utf8')
              : 'Tahmin üretilemedi. Actions çalışma kayıtlarını kontrol edin.';
            const metadata = fs.existsSync('data/refresh_metadata.json')
              ? fs.readFileSync('data/refresh_metadata.json', 'utf8')
              : '{}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '@Yakarca',
              `**Çalışma:** [GitHub Actions #${context.runNumber}](${runUrl})`,
              '',
              forecast,
              '',
              '<details><summary>Veri yenileme özeti</summary>',
              '',
              '```json',
              metadata,
              '```',
              '</details>'
            ].join('\n');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            let issue = issues.data.find(item => !item.pull_request && item.title === title);
            if (!issue) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: '@Yakarca\nBu issue, LTFM tahminlerinin üç saatte bir GitHub hesabına bildirim olarak bırakıldığı sabit akıştır.'
              });
              issue = created.data;
            }
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              assignees: ['Yakarca']
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body
            });
